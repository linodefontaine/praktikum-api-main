<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>H2H Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; width: 200px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .price { color: #e91e63; font-weight: bold; }
        .search-box { margin-bottom: 20px; }
        input[type="text"] { padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #e91e63; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>✨ Etalase Merchandise H2H ✨</h1>
    
    <!-- Kotak Pencarian Baru -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari nama merchandise...">
        <button onclick="cariProduk()">Cari</button>
    </div>

    <div id="product-container" class="grid">
        <p>Memuat data dari API...</p>
    </div>

    <script>
        // Membungkus logika fetch ke dalam sebuah fungsi agar bisa dipanggil berulang-ulang
        function fetchProducts(keyword = '') {
            const container = document.getElementById('product-container');
            container.innerHTML = '<p>Mencari data...</p>';

            // URL API sekarang bisa menerima parameter pencarian
            const apiUrl = keyword ? `http://127.0.0.1:8000/api/products?search=${keyword}` : 'http://127.0.0.1:8000/api/products';

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    container.innerHTML = '';

                    if (!data || !Array.isArray(data.data) || data.data.length === 0) {
                        container.innerHTML = '<p>Barang tidak ditemukan.</p>';
                        return;
                    }

                    data.data.forEach(product => {
                        const imageUrl = product.image
                            ? `http://127.0.0.1:8000/storage/${product.image}`
                            : 'https://placehold.co/200x200/eeeeee/999999?text=No+Image';

                        const card = `
                            <div class="card">
                                <img src="${imageUrl}" alt="${product.name}">
                                <h3>${product.name}</h3>
                                <p>Stok: ${product.stock}</p>
                                <p class="price">Rp ${product.price}</p>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                })
                .catch(error => {
                    container.innerHTML = '<p>Gagal terhubung ke API.</p>';
                });
        }

        // Fungsi yang dijalankan saat tombol "Cari" diklik
        function cariProduk() {
            const keyword = document.getElementById('searchInput').value;
            fetchProducts(keyword);
        }

        // Memanggil semua data saat web pertama kali dibuka
        fetchProducts();
    </script>

</body>
</html>
